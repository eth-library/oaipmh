[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oaipmh"
version = "4.0.0"
description = "Python implementation of the Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Infrae", email = "info@infrae.com" },
]
maintainers = [
    { name = "Jaime Cardozo", email = "jaime.cardozo@library.ethz.ch" },
    { name = "ETH Library — Data Science and Research Support", email = "dsr@library.ethz.ch" },
]
dependencies = ["lxml"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Web Environment",
]
keywords = ["OAI-PMH", "xml", "archive", "metadata", "harvesting"]

[project.urls]
Repository = "https://github.com/eth-library/oaipmh"
Original-Repository = "https://github.com/infrae/pyoai"
Changelog = "https://github.com/eth-library/oaipmh/blob/main/CHANGELOG.md"
Issues = "https://github.com/eth-library/oaipmh/issues"

[project.optional-dependencies]
test = ["pytest"]

[dependency-groups]
typecheck = ["mypy", "types-lxml"]

[tool.pytest.ini_options]
testpaths = ["src/oaipmh/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Keep existing timezone.utc spelling while raising the compatibility target
ignore = ["UP017"]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
warn_unreachable = true
python_version = "3.11"
files = ["src/oaipmh", "scripts"]
enable_error_code = ["ignore-without-code"]

# Tests are type-checked but need no annotations; scripts/ test modules are top-level names
[[tool.mypy.overrides]]
module = ["oaipmh.tests.*", "test_distribution_checks", "test_release_checks"]
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.hatch.build.targets.wheel]
packages = ["src/oaipmh"]
exclude = [
    "src/oaipmh/tests",
]

[tool.hatch.build.targets.sdist]
# Root anchors prevent similarly named files in nested checkouts from being included
include = [
    "/src/oaipmh",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]
exclude = [
    "src/oaipmh/tests",
]
