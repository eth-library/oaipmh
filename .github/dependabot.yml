version: 2

updates:
  # GitHub Actions: SHA-pinned `uses:` references in workflow files.
  # Mechanical updates; group them into a single PR per week.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  # Dependabot's native `uv` ecosystem regenerates `uv.lock` as part of
  # each PR. Keep dependency updates separate so each can be tested and
  # reviewed independently.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
