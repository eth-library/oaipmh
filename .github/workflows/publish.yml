name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-distributions.yml

  # The reusable workflow must finish every install job before upload is eligible
  publish:
    name: Publish validated distributions to PyPI
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/oaipmh
    # Trusted Publishing credentials are confined to this upload job
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix-cache
        with:
          job-name: publish-verify
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: dist/validated/
      - name: Verify release identity and exact artifact checksums
        run: nix develop .#default --command python scripts/check_release.py before-publish dist/validated
      - name: Publish the tested files without rebuilding
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/validated/release/

  # These checks detect post-upload failures and cannot replace the pre-upload gate
  check-pypi:
    name: Verify production PyPI installation
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.validate.outputs.shells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix-cache
        with:
          job-name: pypi-${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: dist/validated/
      - name: Check production metadata and artifact bytes
        run: nix develop .#${{ matrix.python }} --command python scripts/check_release.py pypi dist/validated
      - name: Install the exact version from production PyPI
        run: nix develop .#${{ matrix.python }} --command python scripts/check_installation.py dist/validated ${{ matrix.python }} --pypi
